name: Godot headless validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot
        shell: bash
        run: |
          archive="$RUNNER_TEMP/godot.zip"
          install_dir="$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_SHA256}  ${archive}" | sha256sum --check
          mkdir --parents "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Import project and register global classes
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Run case foundation validation
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/case_foundation_test.tscn

      - name: Run manual case processing integration
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/manual_case_processing_test.tscn

      - name: Run commissioning domain validation
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/commissioning_test.tscn

      - name: Run First Shift sequencing validation
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/first_shift_test.tscn

      - name: Run progressive room state validation
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/progressive_room_states_test.tscn

      - name: Run Archive Room lighting correction validation
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/archive_room_lighting_test.tscn

      - name: Run production pipeline validation
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/production_pipeline_test.tscn

      - name: Run Full-HD visual foundation validation
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/visual_foundation_test.tscn

      - name: Smoke-test the configured main scene
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 120
